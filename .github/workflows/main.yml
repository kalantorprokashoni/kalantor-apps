name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org com.kalantorprokashoni --project-name kalantor_app .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          rm -rf test

      - name: Patch manifest (internet + app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="কালান্তর প্রকাশনী"#' $M

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kalantor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
